<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm theo danh mục | Sellora</title>
    <meta name="description" content="Khám phá sản phẩm theo danh mục tại Sellora - Hàng chính hãng, giá tốt nhất">
    <link rel="shortcut icon" href="image/logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js"></script>

    <style>
        /* ══════════════════════════════════════════
            DESIGN TOKENS & CSS VARIABLES
        ══════════════════════════════════════════ */
        :root {
            --primary: #0d9488;
            --primary-lt: #14b8a6;
            --primary-dk: #0f766e;
            --accent: #ee4d2d;
            --bg: #f4f6f8;
            --card: #ffffff;
            --tx: #111827;
            --tx2: #4b5563;
            --tx3: #9ca3af;
            --border: #e5e7eb;
            --shadow: 0 1px 4px rgba(0, 0, 0, .08);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, .1);
            --r: 8px;
            --sidebar-w: 224px;
            --gap: 16px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--tx);
            margin: 0;
            padding: 0;
        }

        /* ── Page wrapper ── */
        .cd-page {
            padding: 16px 0 60px;
        }

        /* ── Breadcrumb ── */
        .cd-breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            color: var(--tx3);
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .cd-breadcrumb a {
            color: var(--tx3);
            text-decoration: none;
            transition: color .15s;
        }

        .cd-breadcrumb a:hover {
            color: var(--primary);
        }

        .cd-breadcrumb .sep {
            font-size: 10px;
            color: var(--border);
        }

        .cd-breadcrumb .current {
            color: var(--tx);
            font-weight: 600;
        }

        /* ── Layout ── */
        .cd-wrap {
            display: flex;
            gap: var(--gap);
            align-items: flex-start;
            position: relative;
        }

        /* ── Cột chứa danh mục (Cuộn tự nhiên cùng sản phẩm) ── */
        .cd-sidebar-slot {
            width: var(--sidebar-w);
            flex-shrink: 0;
        }

        .cd-sidebar {
            background: var(--card);
            border-radius: var(--r);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .cd-sidebar-hd {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px 12px;
            font-size: 13px;
            font-weight: 700;
            background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
            color: #fff;
            letter-spacing: .2px;
            flex-shrink: 0;
        }

        .cd-sidebar-hd i {
            font-size: 14px;
            opacity: .9;
        }

        /* Nội dung danh mục hiển thị tự nhiên */
        #sidebarContent {
            flex: 1;
            padding-bottom: 10px;
        }

        .cd-cat-group {
            padding: 12px 0 6px;
        }

        .cd-cat-parent {
            font-size: 11px;
            font-weight: 700;
            color: var(--tx3);
            text-transform: uppercase;
            letter-spacing: .8px;
            padding: 0 16px 8px;
        }

        .cd-cat-item a {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 16px 8px 20px;
            color: var(--tx2);
            text-decoration: none;
            font-size: 13.5px;
            font-weight: 500;
            transition: all .18s ease;
            border-left: 3px solid transparent;
            position: relative;
        }

        .cd-cat-item a:hover {
            background: #fef7f5;
            color: var(--accent);
            border-left-color: var(--accent);
        }

        .cd-cat-item a.active {
            background: #fef2f0;
            color: var(--accent);
            border-left-color: var(--accent);
            font-weight: 700;
        }

        .cd-cat-item a .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
            opacity: .5;
            transition: opacity .18s;
        }

        .cd-cat-item a:hover .dot,
        .cd-cat-item a.active .dot {
            opacity: 1;
        }

        /* ── Main content area ── */
        .cd-main {
            flex: 1;
            min-width: 0;
        }

        /* ── Sort bar ── */
        .cd-sort-bar {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 16px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            box-shadow: var(--shadow);
        }

        .cd-sort-label {
            font-size: 12.5px;
            color: var(--tx3);
            font-weight: 500;
            white-space: nowrap;
        }

        .cd-sort-btn {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--card);
            font-size: 12.5px;
            font-weight: 500;
            color: var(--tx2);
            cursor: pointer;
            transition: all .15s;
            font-family: 'Inter', sans-serif;
        }

        .cd-sort-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .cd-sort-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            font-weight: 600;
        }

        .cd-result-count {
            margin-left: auto;
            font-size: 12px;
            color: var(--tx3);
            white-space: nowrap;
        }

        /* ── Product grid ── */
        .cd-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        /* ── Product card ── */
        .cd-card {
            background: var(--card);
            border-radius: var(--r);
            overflow: hidden;
            border: 1px solid var(--border);
            transition: all .22s ease;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .cd-card:hover {
            border-color: var(--accent);
            box-shadow: 0 6px 20px rgba(238, 77, 45, .14);
            transform: translateY(-3px);
        }

        .cd-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 4px;
            z-index: 1;
            letter-spacing: .3px;
        }

        .cd-img-wrap {
            aspect-ratio: 1/1;
            overflow: hidden;
            background: #f9f9f9;
        }

        .cd-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
            transition: transform .35s ease;
        }

        .cd-card:hover .cd-img-wrap img {
            transform: scale(1.06);
        }

        .cd-body {
            padding: 10px 11px 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .cd-name {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: var(--tx);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.45;
            flex: 1;
            transition: color .15s;
        }

        .cd-card:hover .cd-name {
            color: var(--accent);
        }

        .cd-price-row {
            display: flex;
            align-items: baseline;
            gap: 7px;
            flex-wrap: wrap;
            margin-top: auto;
        }

        .cd-price {
            color: var(--accent);
            font-size: 15px;
            font-weight: 700;
        }

        .cd-oldprice {
            color: var(--tx3);
            font-size: 11.5px;
            text-decoration: line-through;
        }

        .cd-sold {
            font-size: 11px;
            color: var(--tx3);
        }

        /* ── States ── */
        .cd-loading,
        .cd-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--tx3);
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            background: var(--card);
            border-radius: var(--r);
            border: 1px solid var(--border);
        }

        .cd-loading i {
            font-size: 30px;
            color: var(--primary);
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .cd-empty i {
            font-size: 40px;
            color: var(--border);
        }

        .cd-empty span {
            font-size: 12px;
        }

        /* ── Pagination ── */
        .cd-pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .cd-page-btn {
            min-width: 36px;
            height: 36px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--card);
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
            color: var(--tx2);
            font-family: 'Inter', sans-serif;
            transition: all .15s;
        }

        .cd-page-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .cd-page-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 700;
        }

        .cd-page-btn:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        /* ── Responsive ── */
        @media (max-width: 1100px) {
            .cd-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 900px) {
            .cd-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .cd-sidebar-slot {
                display: none;
            }

            .cd-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 520px) {
            .cd-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
        }
    </style>
</head>

<body>
    <div id="headerweb"></div>

    <div class="contentweb cd-page">
        <div class="container" id="cdContainer">

            <div class="cd-breadcrumb">
                <a href="index"><i class="fa-solid fa-house" style="font-size:11px"></i> Trang chủ</a>
                <span class="sep"><i class="fa-solid fa-chevron-right"></i></span>
                <span class="current" id="bdCurrent">Danh mục</span>
            </div>

            <div class="cd-wrap" id="cdWrap">

                <div class="cd-sidebar-slot" id="cdSlot">
                    <aside class="cd-sidebar" id="cdSidebar">
                        <div class="cd-sidebar-hd">
                            <i class="fa-solid fa-layer-group"></i>
                            Tất Cả Danh Mục
                        </div>
                        <div id="sidebarContent">
                            <div style="padding:20px 16px;color:#9ca3af;font-size:13px;">
                                <i class="fa-solid fa-circle-notch fa-spin" style="margin-right:6px"></i>Đang tải...
                            </div>
                        </div>
                    </aside>
                </div>

                <div class="cd-main">

                    <div class="cd-sort-bar">
                        <span class="cd-sort-label">Sắp xếp theo</span>
                        <button class="cd-sort-btn active" id="sortDefault" onclick="changeSort('default')">Phổ
                            Biến</button>
                        <button class="cd-sort-btn" id="sortNew" onclick="changeSort('id,desc')">Mới Nhất</button>
                        <button class="cd-sort-btn" id="sortSold" onclick="changeSort('sold,desc')">Bán Chạy</button>
                        <button class="cd-sort-btn" id="sortPrice" onclick="changeSort('price,asc')">Giá Thấp</button>
                        <span class="cd-result-count" id="totalText"></span>
                    </div>

                    <div class="cd-grid" id="productGrid">
                        <div class="cd-loading">
                            <i class="fa-solid fa-circle-notch"></i>
                            Đang tải sản phẩm...
                        </div>
                    </div>

                    <div class="cd-pagination" id="cdPagination"></div>

                </div>
            </div>
        </div>
    </div>

    <div class="container" id="footer"></div>

    <script>
        /* ══════════════════════════════════════
            CONFIG
        ══════════════════════════════════════ */
        const BASE_URL = "http://localhost:8080";
        const API_PRODUCTS_BY_CAT = BASE_URL + "/api/product/public/find-by-category";
        const API_CATEGORY_ALL = BASE_URL + "/api/category/public/findAll";

        let currentCategoryId = null;
        let currentPage = 0;
        const PAGE_SIZE = 20;
        let totalPages = 0;
        let currentSort = "default";
        let allCategories = [];

        /* ══════════════════════════════════════
            INIT 
        ══════════════════════════════════════ */
        window.onload = async function () {
            if (typeof loadMenu === "function") loadMenu();

            currentCategoryId = getParam("id");
            await loadAllCategories();
            buildSidebar(currentCategoryId);
            loadProducts(0);
        };

        /* ══════════════════════════════════════
            CATEGORIES PROCESSING
        ══════════════════════════════════════ */
        async function loadAllCategories() {
            try {
                const res = await fetch(API_CATEGORY_ALL);
                if (res.ok) allCategories = await res.json();
            } catch (e) { console.error(e); }
        }

        function findById(id) {
            return allCategories.find(c => Number(c.id) === Number(id));
        }
        function getChildren(parentId) {
            return allCategories.filter(c => Number(c.parentId) === Number(parentId));
        }

        function buildSidebar(activeCatId) {
            const box = document.getElementById("sidebarContent");
            const activeCat = findById(activeCatId);
            if (!activeCat) {
                box.innerHTML = '<div style="padding:16px;color:#9ca3af;font-size:13px">Không tìm thấy danh mục</div>';
                return;
            }

            let rootCat = activeCat;
            while (rootCat.parentId) {
                const par = findById(rootCat.parentId);
                if (!par) break;
                rootCat = par;
            }

            document.getElementById("bdCurrent").textContent = activeCat.name || "";
            document.title = (activeCat.name || "Danh mục") + " | Sellora";

            const children = getChildren(rootCat.id);
            const isSelf = Number(activeCatId) === Number(rootCat.id);

            let html = `
                <div class="cd-cat-group">
                    <div class="cd-cat-parent">${esc(rootCat.name)}</div>
                    <ul style="list-style:none;margin:0;padding:0">
                        <li class="cd-cat-item">
                            <a href="category-detail?id=${rootCat.id}" class="${isSelf ? 'active' : ''}">
                                <span class="dot"></span>Tất cả
                            </a>
                        </li>
            `;

            children.forEach(child => {
                const active = Number(activeCatId) === Number(child.id);
                html += `
                    <li class="cd-cat-item">
                        <a href="category-detail?id=${child.id}" class="${active ? 'active' : ''}">
                            <span class="dot"></span>${esc(child.name)}
                        </a>
                    </li>
                `;
            });

            html += `</ul></div>`;
            box.innerHTML = html;
        }

        /* ══════════════════════════════════════
            PRODUCTS PROCESSING
        ══════════════════════════════════════ */
        async function loadProducts(page) {
            currentPage = page;
            if (!currentCategoryId) return;

            const grid = document.getElementById("productGrid");
            grid.innerHTML = `
                <div class="cd-loading">
                    <i class="fa-solid fa-circle-notch"></i>
                    Đang tải sản phẩm...
                </div>`;

            try {
                const params = new URLSearchParams({
                    categoryId: currentCategoryId,
                    page, size: PAGE_SIZE
                });
                if (currentSort !== "default") params.set("sort", currentSort);

                const res = await fetch(`${API_PRODUCTS_BY_CAT}?${params}`);
                if (!res.ok) throw new Error();

                const data = await res.json();
                const products = data.content || [];
                totalPages = data.totalPages || 0;
                const total = data.totalElements || 0;

                document.getElementById("totalText").textContent =
                    total.toLocaleString("vi-VN") + " sản phẩm";

                renderProducts(products);
                renderPagination();
                if (page > 0) window.scrollTo({ top: 0, behavior: "smooth" });

            } catch (e) {
                console.error(e);
                grid.innerHTML = `
                    <div class="cd-empty">
                        <i class="fa-solid fa-box-open"></i>
                        <strong>Không tải được sản phẩm</strong>
                        <span>Vui lòng thử lại sau</span>
                    </div>`;
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById("productGrid");

            if (!products.length) {
                grid.innerHTML = `
                    <div class="cd-empty">
                        <i class="fa-solid fa-box-open"></i>
                        <strong>Danh mục này chưa có sản phẩm</strong>
                        <span>Hãy quay lại sau nhé!</span>
                    </div>`;
                return;
            }

            grid.innerHTML = products.map(p => {
                const discount = (p.oldPrice && p.price && p.oldPrice > p.price)
                    ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
                const img = p.imageBanner || "image/product1.webp";

                /* Đã fix lỗi onerror */
                return `
                    <div class="cd-card" onclick="location.href='detail?id=${p.id}'">
                        ${discount > 0 ? `<div class="cd-badge">-${discount}%</div>` : ""}
                        <div class="cd-img-wrap">
                            <img src="${img}"
                                 alt="${esc(p.name)}"
                                 onerror="this.onerror=null; this.src='image/product1.webp'"
                                 loading="lazy">
                        </div>
                        <div class="cd-body">
                            <a class="cd-name" href="detail?id=${p.id}">${esc(p.name)}</a>
                            <div class="cd-price-row">
                                <span class="cd-price">${money(p.price)}</span>
                                ${p.oldPrice && p.oldPrice > p.price
                        ? `<span class="cd-oldprice">${money(p.oldPrice)}</span>` : ""}
                            </div>
                            ${p.sold ? `<div class="cd-sold">Đã bán ${p.sold.toLocaleString("vi-VN")}</div>` : ""}
                        </div>
                    </div>`;
            }).join("");
        }

        /* ══════════════════════════════════════
            PAGINATION
        ══════════════════════════════════════ */
        function renderPagination() {
            const box = document.getElementById("cdPagination");
            if (totalPages <= 1) { box.innerHTML = ""; return; }

            const MAX = 5;
            let start = Math.max(0, currentPage - Math.floor(MAX / 2));
            let end = Math.min(totalPages - 1, start + MAX - 1);
            if (end - start < MAX - 1) start = Math.max(0, end - MAX + 1);

            let h = btn(`<i class="fa-solid fa-chevron-left"></i>`, currentPage - 1, currentPage === 0);
            if (start > 0) { h += btn("1", 0); if (start > 1) h += `<span class="cd-page-btn" style="pointer-events:none;border:none;background:none">…</span>`; }
            for (let i = start; i <= end; i++) h += btn(i + 1, i, false, i === currentPage);
            if (end < totalPages - 1) { if (end < totalPages - 2) h += `<span class="cd-page-btn" style="pointer-events:none;border:none;background:none">…</span>`; h += btn(totalPages, totalPages - 1); }
            h += btn(`<i class="fa-solid fa-chevron-right"></i>`, currentPage + 1, currentPage + 1 >= totalPages);

            box.innerHTML = h;
        }

        function btn(label, page, disabled = false, active = false) {
            return `<button class="cd-page-btn${active ? ' active' : ''}"
                ${disabled ? 'disabled' : `onclick="loadProducts(${page})"`}>${label}</button>`;
        }

        /* ══════════════════════════════════════
            SORT CONTROLLER
        ══════════════════════════════════════ */
        function changeSort(type) {
            currentSort = type;
            document.querySelectorAll(".cd-sort-btn").forEach(b => b.classList.remove("active"));
            document.querySelectorAll(".cd-sort-btn").forEach(b => {
                if (b.getAttribute("onclick").includes(`'${type}'`)) {
                    b.classList.add("active");
                }
            });
            loadProducts(0);
        }

        /* ══════════════════════════════════════
            UTILS
        ══════════════════════════════════════ */
        function getParam(k) { return new URLSearchParams(location.search).get(k); }
        function money(n) { return Number(n || 0).toLocaleString("vi-VN") + " ₫"; }
        function esc(s) {
            return s ? String(s)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : "";
        }
    </script>
</body>

</html>
