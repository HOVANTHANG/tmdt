<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm</title>

    <link rel="shortcut icon" href="image/logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/1.1.3/sweetalert.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert/1.1.3/sweetalert.min.js"></script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia">
    <link href="https://fonts.googleapis.com/css?family=Quicksand" rel="stylesheet">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <link rel="stylesheet" href="http://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/css/toastr.min.css">
    <script src="http://cdnjs.cloudflare.com/ajax/libs/toastr.js/2.0.2/js/toastr.min.js"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
    <link rel="stylesheet" type="text/css" href="css/style.css">

    <script src="js/main.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/comment.js"></script>

    <style>
        .variant-option {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            text-align: center;
            background: #fff;
            transition: 0.2s;
            margin-bottom: 10px;
            font-size: 14px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .variant-option:hover {
            border-color: #d70018;
        }

        .variant-option.active {
            border-color: #d70018;
            background: #fff5f5;
            color: #d70018;
            font-weight: 600;
        }

        .variant-image {
            width: 100%;
            border-radius: 10px;
            object-fit: cover;
        }

        .thumb-item img {
            width: 100%;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
            cursor: pointer;
        }

        .thumb-item img.active-thumb {
            border: 2px solid #d70018;
        }

        .price-box {
            margin-bottom: 10px;
        }

        .stock-box {
            margin-top: 10px;
            font-size: 14px;
            color: #444;
        }

        .shop-line {
            margin-bottom: 12px;
            font-size: 14px;
        }

        .shop-line span {
            font-weight: 600;
        }

        .spec-row {
            display: block;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .spec-label {
            font-weight: 600;
            color: #333;
        }

        .spec-value {
            color: #555;
        }

        #descriptiondetail {
            max-height: 500px;
            overflow: hidden;
            transition: 0.3s;
        }

        .related-card {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
            height: 100%;
        }

        .related-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
        }

        .related-name {
            display: block;
            margin-top: 8px;
            font-size: 14px;
            color: #222;
            text-decoration: none;
            min-height: 42px;
        }

        .related-name:hover {
            color: #d70018;
        }

        .variant-section-title {
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 8px;
            display: block;
        }

        .empty-comment {
            padding: 12px;
            background: #fafafa;
            border: 1px dashed #ddd;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }
    </style>

    <script>
        window.onload = function () {
            loadMenu();
            loadAProduct();
            loadProductComment();
        };
    </script>
</head>

<body>
    <div id="headerweb"></div>

    <div class="contentweb">
        <div class="container detailproduct">
            <div class="row">
                <div class="col-sm-8">
                    <h4 class="pronamedetail" id="detailnamepro"></h4>

                    <div class="shop-line">
                        <span>Mã SP:</span> <span id="codepro"></span>
                        <span style="margin-left:16px;">Shop:</span> <span id="shopname"></span>
                    </div>

                    <div class="row">
                        <div class="col-sm-5">
                            <img id="imgdetailpro" src="image/product1.webp" class="imgprodetail variant-image">

                            <div class="listimgdetail row mt-2" id="listimgdetail"></div>
                        </div>

                        <div class="col-sm-7">
                            <div class="price-box">
                                <strong class="newpricestr" id="pricedetail"></strong>
                                <span class="oldpricestr" id="oldpricestr"></span>
                                <span class="vats">| Giá đã bao gồm VAT</span>
                            </div>

                            <div class="divfreeship">
                                <img src="image/freeship.png" class="freeshipimg">
                                <span>MIỄN PHÍ VẬN CHUYỂN TOÀN QUỐC</span>
                            </div>

                            <span id="tier1label" class="variant-section-title" style="display:none;"></span>
                            <div class="row" id="listbonho"></div>

                            <span id="tier2label" class="variant-section-title" style="display:none;"></span>
                            <div class="row" id="listcolor"></div>

                            <span class="variant-section-title">Thông tin biến thể</span>
                            <div class="phukiendikem" id="phukiendikem">Chưa chọn biến thể</div>
                            <div class="stock-box" id="variantstock"></div>

                            <div class="btnmuahangngay mt-3">
                                <button onclick="addCart('MUANGAY')" class="btnmuangay">
                                    Mua ngay
                                    <span class="lbgiaotannha">
                                        Giao tận nhà (COD) <br>Hoặc nhận tại cửa hàng
                                    </span>
                                </button>
                                <button onclick="addCart('ADD')" class="btnthemgiohang">
                                    <i class="fa fa-shopping-cart iconcartdt"></i>Thêm giỏ hàng
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="motasanphamdetail mt-4">
                        <div id="descriptiondetail"></div>
                        <div class="divmore">
                            <span id="lbxemthem">Xem thêm</span>
                        </div>
                    </div>

                    <div class="phanhoisanpham mt-4">
                        <p class="titledes">Phản hồi</p>
                        <div class="listcautlct" id="listcautlct">
                            <div class="empty-comment">Chưa có bình luận nào</div>
                        </div>

                        <div class="col-sm-12 col-12" id="mycomment">
                            <div class="liststar" id="liststar">
                                <span onclick="loadStar(0)" class="fa fa-star checkedstar"></span>
                                <span onclick="loadStar(1)" class="fa fa-star checkedstar"></span>
                                <span onclick="loadStar(2)" class="fa fa-star checkedstar"></span>
                                <span onclick="loadStar(3)" class="fa fa-star checkedstar"></span>
                                <span onclick="loadStar(4)" class="fa fa-star checkedstar"></span>
                            </div>

                            <label id="titlerep" class="lb-chon-danhmuc">Bình luận của bạn</label>
                            <textarea id="noidungbl" class="form-control"></textarea>

                            <div onclick="choosefilecmt.click()" class="divchooseimg">
                                <img src="image/addimg.png">
                                <span id="slfile">Đính kèm hình ảnh (chọn tối đa 3 hình)</span>
                                <span id="errorquan">Chỉ được chọn tối đa 3 ảnh</span>
                                <input onchange="setFile()" type="file" id="choosefilecmt" multiple>
                            </div>

                            <div id="loading">
                                <div class="bar1 bar"></div>
                            </div>
                            <br>
                            <button onclick="saveComment()" class="btn btn-primary form-control">Bình luận</button>
                        </div>
                    </div>
                </div>

                <div class="col-sm-4">
                    <div class="cauhinhchitiet">
                        <p class="tieudesanpham">
                            Thông số kỹ thuật
                            <span id="tenspkythuat"></span>
                        </p>

                        <img id="imganhkythuat" src="image/product1.webp" class="anhcauhinhsp">

                        <div id="thongsochitiet" class="thongtincauhinhdv"></div>
                    </div>

                    <div class="sanphamtuongtudetail mt-4">
                        <p class="tieudesanpham">Sản phẩm tương tự</p>
                        <div id="listsanphamlienquan" class="row"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container" id="footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>
    <script src="js/carousel.js"></script>

    <script>
        let currentProduct = null;
        let selectedVariant = null;
        let selectedTier1Value = null;
        let selectedTier2Value = null;
        let isExpandedDescription = false;

        function getProductIdFromUrl() {
            const url = new URL(window.location.href);
            return url.searchParams.get("id");
        }

        function escapeJs(str) {
            return String(str || "").replace(/'/g, "\\'");
        }

        function formatmoney(amount) {
            return Number(amount || 0).toLocaleString('vi-VN') + " ₫";
        }

        function clickImgdetail(el) {
            document.getElementById("imgdetailpro").src = el.src;
            const all = document.querySelectorAll(".thumb-item img");
            all.forEach(item => item.classList.remove("active-thumb"));
            el.classList.add("active-thumb");
        }

        async function loadAProduct() {
            const id = getProductIdFromUrl();
            if (!id) return;

            const url = `http://localhost:8080/api/product/public/findById?id=${id}`;

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error("Không tải được chi tiết sản phẩm");
                }

                const product = await response.json();
                currentProduct = product;

                renderProductInfo(product);
                renderProductImages(product);
                renderVariants(product);
                renderDescription(product);
                renderTechnicalInfo(product);
                loadSanPhamLienQuan(product);
            } catch (error) {
                console.error("Lỗi loadAProduct:", error);
                toastr.error("Không tải được chi tiết sản phẩm");
            }
        }

        function renderProductInfo(product) {
            document.getElementById("detailnamepro").innerText = product.name || "";
            document.getElementById("codepro").innerText = product.code || "";
            document.getElementById("shopname").innerText = product.shop ? product.shop.shopName : "Không có shop";

            document.getElementById("pricedetail").innerText = formatmoney(product.price || 0);
            document.getElementById("oldpricestr").innerText = product.oldPrice ? formatmoney(product.oldPrice) : "";
            document.getElementById("imgdetailpro").src = product.imageBanner || "image/product1.webp";
            document.getElementById("imganhkythuat").src = product.imageBanner || "image/product1.webp";
            document.getElementById("tenspkythuat").innerText = product.name || "";
        }

        function renderProductImages(product) {
            const listimgdetail = document.getElementById("listimgdetail");
            let html = "";

            const images = [];
            if (product.imageBanner) {
                images.push(product.imageBanner);
            }
            if (product.productImages && product.productImages.length > 0) {
                product.productImages.forEach(item => {
                    if (item.linkImage) {
                        images.push(item.linkImage);
                    }
                });
            }

            images.forEach((src, index) => {
                html += `
                    <div class="col-lg-3 col-md-3 col-sm-3 col-3 thumb-item">
                        <img onclick="clickImgdetail(this)"
                             src="${src}"
                             class="${index === 0 ? 'active-thumb' : ''}">
                    </div>
                `;
            });

            listimgdetail.innerHTML = html;
        }

        function renderVariants(product) {
            const variants = product.productVariants || [];

            const tier1Label = document.getElementById("tier1label");
            const tier2Label = document.getElementById("tier2label");
            const listTier1 = document.getElementById("listbonho");
            const listTier2 = document.getElementById("listcolor");

            tier1Label.style.display = "none";
            tier2Label.style.display = "none";
            listTier1.innerHTML = "";
            listTier2.innerHTML = "";
            selectedVariant = null;
            selectedTier1Value = null;
            selectedTier2Value = null;

            if (!variants.length) {
                document.getElementById("phukiendikem").innerText = "Không có biến thể";
                document.getElementById("variantstock").innerText = "";
                return;
            }

            const tier1name = variants.find(v => v.tier1name)?.tier1name || null;
            const tier2name = variants.find(v => v.tier2name)?.tier2name || null;

            const tier1Values = [...new Set(
                variants.map(v => v.tier1value).filter(v => v != null && v !== "")
            )];

            const tier2Values = [...new Set(
                variants.map(v => v.tier2value).filter(v => v != null && v !== "")
            )];

            if (tier1name && tier1Values.length > 0) {
                tier1Label.style.display = "block";
                tier1Label.innerText = tier1name;

                let html1 = "";
                tier1Values.forEach(value => {
                    html1 += `
                        <div class="col-md-4 col-6">
                            <div class="variant-option" onclick="selectTier1('${escapeJs(value)}', this)">
                                ${value}
                            </div>
                        </div>
                    `;
                });
                listTier1.innerHTML = html1;
            }

            if (tier2name && tier2Values.length > 0) {
                tier2Label.style.display = "block";
                tier2Label.innerText = tier2name;
            }

            if (tier1Values.length > 0) {
                selectedTier1Value = tier1Values[0];
                const first = document.querySelector("#listbonho .variant-option");
                if (first) first.classList.add("active");
                renderTier2Options();
            } else if (tier2Values.length > 0) {
                selectedTier2Value = tier2Values[0];
                renderOnlyTier2Options();
            } else {
                selectedVariant = variants[0];
                updateProductViewByVariant();
            }
        }

        function selectTier1(value, el) {
            selectedTier1Value = value;
            const all = document.querySelectorAll("#listbonho .variant-option");
            all.forEach(item => item.classList.remove("active"));
            el.classList.add("active");
            renderTier2Options();
        }

        function renderTier2Options() {
            const listTier2 = document.getElementById("listcolor");
            const variants = currentProduct.productVariants || [];

            const matched = variants.filter(v => {
                if (selectedTier1Value == null) return true;
                return v.tier1value === selectedTier1Value;
            });

            const tier2Values = [...new Set(
                matched.map(v => v.tier2value).filter(v => v != null && v !== "")
            )];

            if (tier2Values.length === 0) {
                listTier2.innerHTML = "";
                selectedTier2Value = null;
                updateSelectedVariant();
                return;
            }

            let html = "";
            tier2Values.forEach((value, index) => {
                html += `
                    <div class="col-md-4 col-6">
                        <div class="variant-option ${index === 0 ? 'active' : ''}" onclick="selectTier2('${escapeJs(value)}', this)">
                            ${value}
                        </div>
                    </div>
                `;
            });

            listTier2.innerHTML = html;
            selectedTier2Value = tier2Values[0];
            updateSelectedVariant();
        }

        function renderOnlyTier2Options() {
            const listTier2 = document.getElementById("listcolor");
            const variants = currentProduct.productVariants || [];

            const tier2Values = [...new Set(
                variants.map(v => v.tier2value).filter(v => v != null && v !== "")
            )];

            let html = "";
            tier2Values.forEach((value, index) => {
                html += `
                    <div class="col-md-4 col-6">
                        <div class="variant-option ${index === 0 ? 'active' : ''}" onclick="selectTier2('${escapeJs(value)}', this)">
                            ${value}
                        </div>
                    </div>
                `;
            });

            listTier2.innerHTML = html;
            selectedTier2Value = tier2Values[0];
            updateSelectedVariant();
        }

        function selectTier2(value, el) {
            selectedTier2Value = value;
            const all = document.querySelectorAll("#listcolor .variant-option");
            all.forEach(item => item.classList.remove("active"));
            el.classList.add("active");
            updateSelectedVariant();
        }

        function updateSelectedVariant() {
            const variants = currentProduct.productVariants || [];

            selectedVariant = variants.find(v => {
                const ok1 = selectedTier1Value == null || v.tier1value === selectedTier1Value;
                const ok2 = selectedTier2Value == null || v.tier2value === selectedTier2Value;
                return ok1 && ok2;
            }) || null;

            updateProductViewByVariant();
        }

        function updateProductViewByVariant() {
            if (!selectedVariant) return;

            document.getElementById("pricedetail").innerText =
                formatmoney(selectedVariant.price || currentProduct.price || 0);

            document.getElementById("phukiendikem").innerText =
                buildVariantDisplayText(selectedVariant);

            document.getElementById("variantstock").innerText =
                `Số lượng còn lại: ${selectedVariant.quantity || 0}`;

            if (selectedVariant.image) {
                document.getElementById("imgdetailpro").src = selectedVariant.image;
            }
            idVariantCart = selectedVariant.id;
        }

        function buildVariantDisplayText(variant) {
            let text = "";
            if (variant.tier1value) text += variant.tier1value;
            if (variant.tier2value) {
                text += text ? " - " + variant.tier2value : variant.tier2value;
            }
            return text || "Biến thể mặc định";
        }

        function renderDescription(product) {
            document.getElementById("descriptiondetail").innerHTML = product.description || "";
        }

        function renderTechnicalInfo(product) {
            let html = "";

            if (product.category && product.category.name) {
                html += `<span class="spec-row"><span class="spec-label">Danh mục: </span><span class="spec-value">${product.category.name}</span></span>`;
            }
            if (product.tradeMark && product.tradeMark.name) {
                html += `<span class="spec-row"><span class="spec-label">Thương hiệu: </span><span class="spec-value">${product.tradeMark.name}</span></span>`;
            }
            if (product.screen) {
                html += `<span class="spec-row"><span class="spec-label">Màn hình: </span><span class="spec-value">${product.screen}</span></span>`;
            }
            if (product.operaSystem) {
                html += `<span class="spec-row"><span class="spec-label">Hệ điều hành: </span><span class="spec-value">${product.operaSystem}</span></span>`;
            }
            if (product.cpu) {
                html += `<span class="spec-row"><span class="spec-label">CPU: </span><span class="spec-value">${product.cpu}</span></span>`;
            }
            if (product.mobileNetwork) {
                html += `<span class="spec-row"><span class="spec-label">Mạng di động: </span><span class="spec-value">${product.mobileNetwork}</span></span>`;
            }
            if (product.sim) {
                html += `<span class="spec-row"><span class="spec-label">SIM: </span><span class="spec-value">${product.sim}</span></span>`;
            }
            if (product.specialFeature) {
                html += `<span class="spec-row"><span class="spec-label">Tính năng đặc biệt: </span><span class="spec-value">${product.specialFeature}</span></span>`;
            }
            if (product.securityInfor) {
                html += `<span class="spec-row"><span class="spec-label">Bảo mật: </span><span class="spec-value">${product.securityInfor}</span></span>`;
            }

            document.getElementById("thongsochitiet").innerHTML = html;
        }

        async function addCart(type) {
            if (!selectedVariant || !selectedVariant.id) {
                toastr.warning("Vui lòng chọn biến thể sản phẩm");
                return;
            }

            const url = `http://localhost:8080/api/cart/user/add-cart?productVariantId=${selectedVariant.id}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: new Headers({
                        'Authorization': 'Bearer ' + token
                    })
                });

                if (response.status < 300) {
                    if (type === "MUANGAY") {
                        window.location.href = "cart";
                    } else {
                        toastr.success("Đã thêm vào giỏ hàng");
                    }
                } else {
                    toastr.error("Không thể thêm vào giỏ hàng");
                }
            } catch (error) {
                console.error(error);
                toastr.error("Có lỗi xảy ra");
            }
        }

        async function loadSanPhamLienQuan(product) {
            if (!product || !product.category || !product.id) return;

            const url = `http://localhost:8080/api/product/public/san-pham-lien-quan?idCategory=${product.category.id}&idproduct=${product.id}`;

            try {
                const response = await fetch(url);
                if (!response.ok) return;

                const list = await response.json();
                let html = "";

                for (let i = 0; i < list.length; i++) {
                    html += `
                        <div class="col-md-6 col-sm-6 col-6 mb-3">
                            <div class="related-card">
                                <a href="detail?id=${list[i].id}">
                                    <img src="${list[i].imageBanner || 'image/product1.webp'}">
                                </a>
                                <a class="related-name" href="detail?id=${list[i].id}">
                                    ${list[i].name || ''}
                                </a>
                                <div class="priceproduct">
                                    <strong class="newpricelq">${formatmoney(list[i].price || 0)}</strong>
                                    <span class="oldprice">${list[i].oldPrice ? formatmoney(list[i].oldPrice) : ""}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                document.getElementById("listsanphamlienquan").innerHTML =
                    html || `<div class="col-12"><div class="empty-comment">Không có sản phẩm tương tự</div></div>`;
            } catch (error) {
                console.error("Lỗi loadSanPhamLienQuan:", error);
            }
        }

        document.getElementById("lbxemthem").onclick = function () {
            const desc = document.getElementById("descriptiondetail");
            const btn = document.getElementById("lbxemthem");

            if (!isExpandedDescription) {
                desc.style.maxHeight = "none";
                btn.innerText = "Thu gọn";
                isExpandedDescription = true;
            } else {
                desc.style.maxHeight = "500px";
                btn.innerText = "Xem thêm";
                isExpandedDescription = false;
            }
        };
    </script>
</body>

</html>
